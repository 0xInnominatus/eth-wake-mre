on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Wake environment
        uses: Ackee-Blockchain/wake-setup-action@0.1.0

      - name: Wake up
        run: wake --version
      
      - name: Compile contracts
        run: wake compile
      
      - name: Generate pytypes
        run: wake pytypes generate
      
      - name: Run tests
        run: wake test
