[compiler.solc]
target_version = "0.8.23"
evm_version = "paris"
via_IR = true
exclude_paths = ["lib", "script", "node_modules", ".venv", "venv", "test"]
include_paths = ["node_modules"]

[compiler.solc.optimizer]
enabled = true
runs = 200

[detectors]
exclude = []
ignore_paths = [".venv", "venv", "test"]
exclude_paths = ["lib", "script", "node_modules", ".venv", "venv", "test"]

[testing]
cmd = "anvil"

[testing.anvil]
cmd_args = "--prune-history 100 --transaction-block-keeper 10 --steps-tracing --silent"

[testing.ganache]
cmd_args = "-k istanbul -q"

[testing.hardhat]
cmd_args = ""